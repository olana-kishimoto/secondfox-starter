name: 係の見回り（止まったままの課題を拾う）

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  watchdog:
    if: ${{ vars.AGENT_ENABLED == 'true' }}
    uses: olana-kishimoto/secondfox-harness/.github/workflows/watchdog-reusable.yml@main
    secrets:
      harness_read_token: ${{ secrets.HARNESS_READ_TOKEN }}
